<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Autoparco - Segnalazione Difetti</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #102a43;
            text-align: center;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #486581;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bcccdc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            background-color: #d64545;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ba2525;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e4e7eb;
            margin: 25px 0;
        }
        .difetto-card {
            background: #fff3f3;
            border-left: 4px solid #d64545;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .difetto-targa {
            font-weight: bold;
            font-size: 1.1rem;
            color: #102a43;
        }
        .difetto-data {
            font-size: 0.8rem;
            color: #829ab1;
            margin-bottom: 8px;
        }
        .btn-risolto {
            background-color: #2fb344;
            padding: 6px 10px;
            font-size: 0.8rem;
            margin-top: 10px;
            width: auto;
        }
        .btn-risolto:hover {
            background-color: #238c34;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Registro Difetti Autoparco</h1>
        
        <form id="formDifetti">
            <div class="form-group">
                <label for="targa">Targa o Nome Veicolo</label>
                <input type="text" id="targa" placeholder="Es. AB123CD oppure Furgone 1" required>
            </div>
            <div class="form-group">
                <label for="descrizione">Descrizione del difetto</label>
                <textarea id="descrizione" rows="3" placeholder="Es. Specchietto destro graffiato, spia motore accesa..." required></textarea>
            </div>
            <button type="submit">Segnala Difetto</button>
        </form>

        <hr>

        <h2>Difetti Segnalati:</h2>
        <div id="listaDifetti">
            </div>
    </div>

    <script>
        // Carichiamo i difetti salvati in memoria, o creiamo una lista vuota
        let difetti = JSON.parse(localStorage.getItem('autoparco_difetti')) || [];
        const listaDifettiDiv = document.getElementById('listaDifetti');
        const form = document.getElementById('formDifetti');

        // Funzione per mostrare i difetti a schermo
        function aggiornaLista() {
            listaDifettiDiv.innerHTML = ''; // Puliamo la lista
            
            if (difetti.length === 0) {
                listaDifettiDiv.innerHTML = '<p style="color: #829ab1; text-align: center;">Nessun difetto segnalato. Tutti i mezzi sono perfetti! ✨</p>';
                return;
            }

            // Creiamo la "scheda" per ogni difetto
            difetti.forEach((difetto, index) => {
                const card = document.createElement('div');
                card.className = 'difetto-card';
                card.innerHTML = `
                    <div class="difetto-targa">${difetto.targa}</div>
                    <div class="difetto-data">${difetto.data}</div>
                    <div class="difetto-descrizione">${difetto.descrizione}</div>
                    <button class="btn-risolto" onclick="rimuoviDifetto(${index})">Segna come Riparato ✔️</button>
                `;
                listaDifettiDiv.appendChild(card);
            });
        }

        // Cosa succede quando clicchiamo "Segnala Difetto"
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Evita che la pagina si ricarichi

            const targaInput = document.getElementById('targa').value;
            const descrizioneInput = document.getElementById('descrizione').value;
            const dataOggi = new Date().toLocaleString('it-IT');

            const nuovoDifetto = {
                targa: targaInput,
                descrizione: descrizioneInput,
                data: dataOggi
            };

            difetti.push(nuovoDifetto); // Aggiungiamo alla lista
            localStorage.setItem('autoparco_difetti', JSON.stringify(difetti)); // Salviamo in memoria
            
            form.reset(); // Svuotiamo i campi del modulo
            aggiornaLista(); // Aggiorniamo la visualizzazione
        });

        // Funzione per eliminare un difetto riparato
        window.rimuoviDifetto = function(index) {
            if(confirm('Confermi che questo difetto è stato riparato?')) {
                difetti.splice(index, 1); // Rimuove dalla lista
                localStorage.setItem('autoparco_difetti', JSON.stringify(difetti)); // Aggiorna la memoria
                aggiornaLista();
            }
        };

        // Mostriamo la lista appena si apre l'app
        aggiornaLista();
    </script>

</body>
</html>
