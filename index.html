<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segnalazioni Autoparco CRI Gallarate</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d64545">
    <link rel="apple-touch-icon" href="icona.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #102a43;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #627d98;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        /* STILE DEL NUOVO BOTTONE DI INSTALLAZIONE */
        #btn-installa {
            display: none; /* Nascosto di default, si accende solo se serve */
            background-color: #1976d2; /* Blu per distinguerlo */
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: none;
            width: 100%;
        }
        #btn-installa:hover {
            background-color: #115293;
        }

        .btn-nuova-segnalazione {
            display: block;
            background-color: #d64545; /* Rosso CRI */
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-nuova-segnalazione:hover {
            background-color: #ba2525;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e4e7eb;
            margin: 20px 0;
        }
        
        /* Stili per i gruppi di veicoli (fisarmonica) */
        .veicolo-group {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        .veicolo-titolo {
            background: #ffffff;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 0;
            border-bottom: 2px solid transparent;
        }
        .veicolo-titolo:hover {
            background-color: #f1f5f9;
        }
        .veicolo-titolo.aperto {
            border-bottom: 2px solid #cbd5e1;
            background-color: #f1f5f9;
        }
        
        .titolo-sinistra {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        
        .icona-freccia {
            font-size: 0.9rem;
            color: #64748b;
            transition: transform 0.3s ease;
        }
        .icona-freccia.ruotata {
            transform: rotate(180deg);
        }

        .badge-conteggio {
            background: #d64545;
            color: white;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .difetti-container {
            display: none;
            padding: 15px;
            background: #f8fafc;
        }
        .difetti-container.mostra {
            display: block;
        }

        .difetto-card {
            background: #fff;
            border: 1px solid #e4e7eb;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .difetto-card:last-child {
            margin-bottom: 0;
        }
        .difetto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .data-segnalazione {
            font-size: 0.75rem;
            color: #829ab1;
        }
        .tipologia-badge {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .descrizione {
            color: #334e68;
            margin-bottom: 10px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .footer-card {
            font-size: 0.85rem;
            color: #627d98;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #e4e7eb;
            padding-top: 10px;
            margin-top: 10px;
        }
        .foto-link {
            color: #0070f3;
            text-decoration: none;
            font-weight: bold;
        }
        .foto-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #627d98;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Segnalazioni autoparco CRI Gallarate</h1>
        <p class="subtitle">Dati aggiornati in tempo reale</p>
        
        <button id="btn-installa">📲 Installa App sul Telefono</button>

        <a href="https://forms.gle/oBhFEMTXRkrYGaBD9" class="btn-nuova-segnalazione" target="_blank">➕ Inserisci Nuova Segnalazione</a>

        <hr>

        <div id="listaDifetti">
            <div class="loading">Caricamento dati dal database... ⏳</div>
        </div>
    </div>

    <script>
        // --- LOGICA INSTALLAZIONE APP (PWA) ---
        let promptInstallazione;
        const btnInstalla = document.getElementById('btn-installa');

        // 1. Registra il Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        // 2. Rileva Android (Chrome) e mostra il bottone
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            promptInstallazione = e;
            btnInstalla.style.display = 'block'; // Mostra il bottone
        });

        // 3. Rileva iPhone/iPad (Safari)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
        
        if (isIOS && !isStandalone) {
            btnInstalla.style.display = 'block'; // Mostra il bottone
            btnInstalla.textContent = "📲 Come installare su iPhone";
        }

        // 4. Cosa succede quando si clicca il bottone
        btnInstalla.addEventListener('click', async () => {
            if (promptInstallazione) {
                // Utente Android: avvia l'installazione automatica
                promptInstallazione.prompt();
                const { outcome } = await promptInstallazione.userChoice;
                if (outcome === 'accepted') {
                    btnInstalla.style.display = 'none';
                }
                promptInstallazione = null;
            } else if (isIOS) {
                // Utente Apple: mostra le istruzioni per anziani
                alert("Per installare l'app su iPhone:\n\n1️⃣ Tocca l'icona 'Condividi' (il quadrato con la freccia in alto) in basso sullo schermo.\n2️⃣ Scorri in basso e tocca 'Aggiungi alla schermata Home' ➕.\n3️⃣ Conferma toccando 'Aggiungi' in alto a destra.");
            }
        });
        // --- FINE LOGICA APP ---


        // --- LOGICA DATI E GRAFICA (INVARIATA) ---
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8wQ0jGLsUvO8VqP8SnyuLlar0zApUn1maRLMEWMFL2EFrv2LFcxGkLJ6X3vf4ilsDWPRAzHjcub-l/pub?output=csv';
        const listaDifettiDiv = document.getElementById('listaDifetti');

        Papa.parse(csvUrl, {
            download: true,
            header: true, 
            complete: function(results) {
                const dati = results.data;
                mostraDifetti(dati);
            },
            error: function(err) {
                listaDifettiDiv.innerHTML = '<p style="color: red; text-align: center;">Errore nel caricamento. Controlla il link del file CSV.</p>';
            }
        });

        function mostraDifetti(dati) {
            listaDifettiDiv.innerHTML = ''; 

            const difettiValidi = dati.filter(riga => {
                const haSigla = riga['Sigla radio'] && riga['Sigla radio'].trim() !== '';
                const eRisolto = Object.values(riga).some(val => typeof val === 'string' && val.trim().toLowerCase() === 'risolto');
                return haSigla && !eRisolto;
            });

            if (difettiValidi.length === 0) {
                listaDifettiDiv.innerHTML = '<p style="text-align: center; color: #2fb344; font-weight: bold; padding: 20px;">Nessun difetto segnalato. Tutti i mezzi sono operativi! ✨</p>';
                return;
            }

            const raggruppati = {};
            
            difettiValidi.reverse().forEach(difetto => {
                const siglaCompleta = difetto['Sigla radio'].trim();
                const siglaCorta = siglaCompleta.substring(0, 7);
                
                if (!raggruppati[siglaCorta]) {
                    raggruppati[siglaCorta] = [];
                }
                raggruppati[siglaCorta].push(difetto);
            });

            const palette = [
                { bg: '#ffe3e3', text: '#d64545' }, 
                { bg: '#e3f2fd', text: '#1976d2' }, 
                { bg: '#fff3e0', text: '#f57c00' }, 
                { bg: '#e8f5e9', text: '#388e3c' }, 
                { bg: '#f3e5f5', text: '#7b1fa2' }, 
                { bg: '#e0f7fa', text: '#0097a7' }, 
                { bg: '#fff9c4', text: '#fbc02d' }  
            ];
            
            const coloriTipologia = {};
            let indiceColore = 0;

            for (const [sigla, listaDifettiMezzo] of Object.entries(raggruppati)) {
                
                const veicoloDiv = document.createElement('div');
                veicoloDiv.className = 'veicolo-group';
                
                const veicoloTitolo = document.createElement('div');
                veicoloTitolo.className = 'veicolo-titolo';
                
                veicoloTitolo.innerHTML = `
                    <div class="titolo-sinistra">
                        <span class="icona-freccia">▼</span>
                        <span>🚐 ${sigla}</span>
                    </div>
                    <span class="badge-conteggio">${listaDifettiMezzo.length}</span>
                `;

                const difettiContainer = document.createElement('div');
                difettiContainer.className = 'difetti-container';

                veicoloTitolo.addEventListener('click', () => {
                    difettiContainer.classList.toggle('mostra');
                    veicoloTitolo.classList.toggle('aperto');
                    const freccia = veicoloTitolo.querySelector('.icona-freccia');
                    freccia.classList.toggle('ruotata');
                });

                listaDifettiMezzo.forEach(difetto => {
                    const tipologia = difetto['Tipologia Difetto'] || 'Generico';
                    
                    if (!coloriTipologia[tipologia]) {
                        coloriTipologia[tipologia] = palette[indiceColore % palette.length];
                        indiceColore++;
                    }
                    const colore = coloriTipologia[tipologia];

                    const card = document.createElement('div');
                    card.className = 'difetto-card';
                    
                    let fotoHtml = '<span>Nessuna foto</span>';
                    if (difetto['Foto'] && difetto['Foto'].trim() !== '') {
                        fotoHtml = `<a href="${difetto['Foto']}" target="_blank" class="foto-link">📷 Vedi Foto</a>`;
                    }

                    const dataInserimento = difetto['Informazioni cronologiche'] || '';

                    card.innerHTML = `
                        <div class="difetto-header">
                            <span class="tipologia-badge" style="background-color: ${colore.bg}; color: ${colore.text};">${tipologia}</span>
                            <span class="data-segnalazione">${dataInserimento}</span>
                        </div>
                        <div class="descrizione">${difetto['Descrizione difetto']}</div>
                        
                        <div class="footer-card">
                            <span>👤 Segnalatore: <strong>${difetto['Cognome e Nome segnalatore'] || 'Non specificato'}</strong></span>
                            ${fotoHtml}
                        </div>
                    `;
                    difettiContainer.appendChild(card);
                });

                veicoloDiv.appendChild(veicoloTitolo);
                veicoloDiv.appendChild(difettiContainer);
                
                listaDifettiDiv.appendChild(veicoloDiv);
            }
        }
    </script>

</body>
</html>
