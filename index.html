<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Autoparco - Segnalazione Difetti</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #102a43;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #627d98;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .btn-nuova-segnalazione {
            display: block;
            background-color: #d64545;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-nuova-segnalazione:hover {
            background-color: #ba2525;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e4e7eb;
            margin: 20px 0;
        }
        
        /* Stili per i gruppi di veicoli (fisarmonica) */
        .veicolo-group {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden; /* Mantiene arrotondati gli angoli anche quando aperto */
        }
        .veicolo-titolo {
            background: #ffffff;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer; /* Fa capire che è cliccabile */
            transition: background-color 0.2s;
            margin: 0;
            border-bottom: 2px solid transparent;
        }
        .veicolo-titolo:hover {
            background-color: #f1f5f9;
        }
        .veicolo-titolo.aperto {
            border-bottom: 2px solid #cbd5e1;
            background-color: #f1f5f9;
        }
        
        /* Contenitore interno della parte sinistra del titolo (freccia + icona + nome) */
        .titolo-sinistra {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
        }
        
        /* Freccia di espansione */
        .icona-freccia {
            font-size: 0.9rem;
            color: #64748b;
            transition: transform 0.3s ease; /* Animazione rotazione */
        }
        .icona-freccia.ruotata {
            transform: rotate(180deg);
        }

        .badge-conteggio {
            background: #d64545;
            color: white;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* Contenitore a scomparsa per le schede dei difetti */
        .difetti-container {
            display: none; /* Nascosto di default */
            padding: 15px;
            background: #f8fafc;
        }
        .difetti-container.mostra {
            display: block; /* Mostrato quando ha la classe .mostra */
        }

        /* Stili per le singole schede difetto */
        .difetto-card {
            background: #fff;
            border: 1px solid #e4e7eb;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .difetto-card:last-child {
            margin-bottom: 0; /* Rimuove lo spazio sotto l'ultima scheda */
        }
        .difetto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .data-segnalazione {
            font-size: 0.75rem;
            color: #829ab1;
        }
        .tipologia-badge {
            display: inline-block;
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
        }
        .descrizione {
            color: #334e68;
            margin-bottom: 10px;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        .footer-card {
            font-size: 0.85rem;
            color: #627d98;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #e4e7eb;
            padding-top: 10px;
            margin-top: 10px;
        }
        .foto-link {
            color: #0070f3;
            text-decoration: none;
            font-weight: bold;
        }
        .foto-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #627d98;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Autoparco - Difetti e Danni</h1>
        <p class="subtitle">Dati aggiornati in tempo reale</p>
        
        <a href="https://forms.gle/oBhFEMTXRkrYGaBD9" class="btn-nuova-segnalazione" target="_blank">➕ Inserisci Nuova Segnalazione</a>

        <hr>

        <div id="listaDifetti">
            <div class="loading">Caricamento dati dal database... ⏳</div>
        </div>
    </div>

    <script>
        // Link CSV aggiornato
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8wQ0jGLsUvO8VqP8SnyuLlar0zApUn1maRLMEWMFL2EFrv2LFcxGkLJ6X3vf4ilsDWPRAzHjcub-l/pub?output=csv';
        
        const listaDifettiDiv = document.getElementById('listaDifetti');

        Papa.parse(csvUrl, {
            download: true,
            header: true, 
            complete: function(results) {
                const dati = results.data;
                mostraDifetti(dati);
            },
            error: function(err) {
                listaDifettiDiv.innerHTML = '<p style="color: red; text-align: center;">Errore nel caricamento. Controlla il link del file CSV.</p>';
            }
        });

        function mostraDifetti(dati) {
            listaDifettiDiv.innerHTML = ''; 

            const difettiValidi = dati.filter(riga => riga['Sigla radio'] && riga['Sigla radio'].trim() !== '');

            if (difettiValidi.length === 0) {
                listaDifettiDiv.innerHTML = '<p style="text-align: center; color: #2fb344; font-weight: bold; padding: 20px;">Nessun difetto segnalato. Tutti i mezzi sono operativi! ✨</p>';
                return;
            }

            // 1. RAGGRUPPIAMO I DIFETTI (Leggendo solo i primi 7 caratteri della Sigla)
            const raggruppati = {};
            
            difettiValidi.reverse().forEach(difetto => {
                const siglaCompleta = difetto['Sigla radio'].trim();
                const siglaCorta = siglaCompleta.substring(0, 7);
                
                if (!raggruppati[siglaCorta]) {
                    raggruppati[siglaCorta] = [];
                }
                raggruppati[siglaCorta].push(difetto);
            });

            // 2. PREPARIAMO I COLORI PER LE TIPOLOGIE
            const palette = [
                { bg: '#ffe3e3', text: '#d64545' }, 
                { bg: '#e3f2fd', text: '#1976d2' }, 
                { bg: '#fff3e0', text: '#f57c00' }, 
                { bg: '#e8f5e9', text: '#388e3c' }, 
                { bg: '#f3e5f5', text: '#7b1fa2' }, 
                { bg: '#e0f7fa', text: '#0097a7' }, 
                { bg: '#fff9c4', text: '#fbc02d' }  
            ];
            
            const coloriTipologia = {};
            let indiceColore = 0;

            // 3. CREIAMO LA GRAFICA PER OGNI MEZZO (A Fisarmonica)
            for (const [sigla, listaDifettiMezzo] of Object.entries(raggruppati)) {
                
                const veicoloDiv = document.createElement('div');
                veicoloDiv.className = 'veicolo-group';
                
                // Creiamo l'intestazione cliccabile
                const veicoloTitolo = document.createElement('div');
                veicoloTitolo.className = 'veicolo-titolo';
                
                // Impostiamo il testo e le icone per l'intestazione
                veicoloTitolo.innerHTML = `
                    <div class="titolo-sinistra">
                        <span class="icona-freccia">▼</span>
                        <span>🚐 ${sigla}</span>
                    </div>
                    <span class="badge-conteggio">${listaDifettiMezzo.length}</span>
                `;

                // Creiamo il contenitore per i difetti (nascosto di default)
                const difettiContainer = document.createElement('div');
                difettiContainer.className = 'difetti-container';

                // Logica del click per espandere/comprimere
                veicoloTitolo.addEventListener('click', () => {
                    // Alterna la visibilità del contenitore dei difetti
                    difettiContainer.classList.toggle('mostra');
                    // Alterna il colore di fondo e la linea del titolo
                    veicoloTitolo.classList.toggle('aperto');
                    // Ruota la freccia
                    const freccia = veicoloTitolo.querySelector('.icona-freccia');
                    freccia.classList.toggle('ruotata');
                });

                // Inseriamo i difetti dentro al contenitore nascosto
                listaDifettiMezzo.forEach(difetto => {
                    const tipologia = difetto['Tipologia Difetto'] || 'Generico';
                    
                    if (!coloriTipologia[tipologia]) {
                        coloriTipologia[tipologia] = palette[indiceColore % palette.length];
                        indiceColore++;
                    }
                    const colore = coloriTipologia[tipologia];

                    const card = document.createElement('div');
                    card.className = 'difetto-card';
                    
                    let fotoHtml = '<span>Nessuna foto</span>';
                    if (difetto['Foto'] && difetto['Foto'].trim() !== '') {
                        fotoHtml = `<a href="${difetto['Foto']}" target="_blank" class="foto-link">📷 Vedi Foto</a>`;
                    }

                    const dataInserimento = difetto['Informazioni cronologiche'] || '';

                    card.innerHTML = `
                        <div class="difetto-header">
                            <span class="tipologia-badge" style="background-color: ${colore.bg}; color: ${colore.text};">${tipologia}</span>
                            <span class="data-segnalazione">${dataInserimento}</span>
                        </div>
                        <div class="descrizione">${difetto['Descrizione difetto']}</div>
                        
                        <div class="footer-card">
                            <span>👤 Segnalatore: <strong>${difetto['Cognome e Nome segnalatore'] || 'Non specificato'}</strong></span>
                            ${fotoHtml}
                        </div>
                    `;
                    difettiContainer.appendChild(card);
                });

                // Assembliamo il tutto: aggiungiamo il titolo e poi il contenitore nascosto
                veicoloDiv.appendChild(veicoloTitolo);
                veicoloDiv.appendChild(difettiContainer);
                
                // Aggiungiamo il veicolo completo alla lista in pagina
                listaDifettiDiv.appendChild(veicoloDiv);
            }
        }
    </script>

</body>
</html>
