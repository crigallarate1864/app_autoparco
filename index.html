<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Autoparco - Segnalazione Difetti</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #102a43;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #627d98;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .btn-nuova-segnalazione {
            display: block;
            background-color: #d64545;
            color: white;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .btn-nuova-segnalazione:hover {
            background-color: #ba2525;
        }
        hr {
            border: 0;
            height: 1px;
            background: #e4e7eb;
            margin: 20px 0;
        }
        .difetto-card {
            background: #fff;
            border: 1px solid #e4e7eb;
            border-left: 5px solid #d64545;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .difetto-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sigla-radio {
            font-weight: bold;
            font-size: 1.2rem;
            color: #102a43;
            background: #f0f4f8;
            padding: 4px 10px;
            border-radius: 4px;
        }
        .id-segnalazione {
            font-size: 0.8rem;
            color: #829ab1;
        }
        .tipologia {
            display: inline-block;
            background: #ffe3e3;
            color: #d64545;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .descrizione {
            color: #334e68;
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .footer-card {
            font-size: 0.85rem;
            color: #627d98;
            display: flex;
            justify-content: space-between;
            border-top: 1px dashed #e4e7eb;
            padding-top: 10px;
            margin-top: 10px;
        }
        .foto-link {
            color: #0070f3;
            text-decoration: none;
            font-weight: bold;
        }
        .foto-link:hover {
            text-decoration: underline;
        }
        .loading {
            text-align: center;
            color: #627d98;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🚗 Autoparco - Difetti e Danni</h1>
        <p class="subtitle">Dati aggiornati in tempo reale</p>
        
        <a href="#" class="btn-nuova-segnalazione" target="_blank">➕ Inserisci Nuova Segnalazione</a>

        <hr>

        <h2>Mezzi con anomalie:</h2>
        <div id="listaDifetti">
            <div class="loading">Caricamento dati dal database... ⏳</div>
        </div>
    </div>

    <script>
        // Il tuo link diretto al CSV
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT8wQ0jGLsUvO8VqP8SnyuLlar0zApUn1maRLMEWMFL2EFrv2LFcxGkLJ6X3vf4ilsDWPRAzHjcub-l/pub?gid=0&single=true&output=csv';
        const listaDifettiDiv = document.getElementById('listaDifetti');

        // Usiamo PapaParse per leggere il CSV
        Papa.parse(csvUrl, {
            download: true,
            header: true, // Dice a PapaParse che la prima riga contiene i nomi delle colonne
            complete: function(results) {
                const dati = results.data;
                mostraDifetti(dati);
            },
            error: function(err) {
                listaDifettiDiv.innerHTML = '<p style="color: red;">Errore nel caricamento dei dati. Controlla il link del file.</p>';
            }
        });

        function mostraDifetti(dati) {
            listaDifettiDiv.innerHTML = ''; // Puliamo la scritta "Caricamento..."

            // Filtriamo righe vuote (a volte Google Sheets lascia righe vuote in fondo)
            const difettiValidi = dati.filter(riga => riga['Sigla Radio'] && riga['Sigla Radio'].trim() !== '');

            if (difettiValidi.length === 0) {
                listaDifettiDiv.innerHTML = '<p style="text-align: center; color: #2fb344; font-weight: bold;">Nessun difetto segnalato. Tutti i mezzi sono operativi! ✨</p>';
                return;
            }

            // Invertiamo l'array così le segnalazioni più recenti (in fondo al foglio) appaiono per prime in alto
            difettiValidi.reverse().forEach(difetto => {
                const card = document.createElement('div');
                card.className = 'difetto-card';
                
                // Gestione della foto (se presente, creiamo un link cliccabile)
                let fotoHtml = '';
                if (difetto['Foto'] && difetto['Foto'].trim() !== '') {
                    fotoHtml = `<a href="${difetto['Foto']}" target="_blank" class="foto-link">📷 Vedi Foto</a>`;
                } else {
                    fotoHtml = `<span>Nessuna foto</span>`;
                }

                card.innerHTML = `
                    <div class="difetto-header">
                        <span class="sigla-radio">${difetto['Sigla Radio']}</span>
                        <span class="id-segnalazione">ID: ${difetto['ID Segnalazione']}</span>
                    </div>
                    <div class="tipologia">${difetto['Tipologia difetto']}</div>
                    <div class="descrizione">${difetto['Descrizione difetto']}</div>
                    
                    <div class="footer-card">
                        <span>👤 Autista: <strong>${difetto['Autista segnalatore']}</strong></span>
                        ${fotoHtml}
                    </div>
                `;
                listaDifettiDiv.appendChild(card);
            });
        }
    </script>

</body>
</html>
