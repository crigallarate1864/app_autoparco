<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>ARGO - Dati mezzi per CID</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d64545">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --cri-red: #d64545;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --font-main: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px 15px; }

        .btn-back {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 600;
        }

        .app-header { text-align: center; margin-bottom: 30px; }

        .app-logo { max-width: 140px; margin-bottom: 15px; }

        h1 { color: #ca8a04; font-size: 1.6rem; margin: 0; font-weight: 800; }

        .subtitle { color: var(--text-muted); font-size: 0.9rem; }

        #searchInput {
            width: 100%;
            padding: 14px 20px;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            margin-bottom: 20px;
        }

        .mezzo-card {
            background: #fff;
            border-radius: 16px;
            margin-bottom: 15px;
            padding: 20px;
            border-left: 5px solid #facc15;
        }

        .mezzo-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .mezzo-sigla { font-weight: 800; }
        .mezzo-targa { font-family: monospace; }

        .btn-copia {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .loading, .errore {
            text-align: center;
            padding: 30px;
            background: #fff;
            border-radius: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="index.html" class="btn-back">← Torna all'Hub ARGO</a>

    <header class="app-header">
        <img src="logo.png" class="app-logo">
        <h1>Dati mezzi per CID</h1>
        <p class="subtitle">Documenti e polizze</p>
    </header>

    <input type="text" id="searchInput" placeholder="🔍 Cerca per targa o sigla">

    <div id="listaMezzi">
        <div class="loading">Caricamento dati dal server... ⏳</div>
    </div>

</div>

<div id="toast">✅ Copiato!</div>

<script>
const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS62rMPUxxmT0xicMLhQClYoh6uq0U3yqEt6-lzwfBxWC1bvbe1ygrZuqpblxeNbmuRBlYlIN6pPINw/pub?output=csv";

const lista = document.getElementById("listaMezzi");
const search = document.getElementById("searchInput");

let dati = [];

// funzione robusta per leggere colonne
function getVal(riga, keys, def = "N/D") {
    const k = Object.keys(riga).find(x =>
        keys.some(key => x.toLowerCase().includes(key))
    );
    return k && riga[k] ? riga[k].trim() : def;
}

// parsing CSV
Papa.parse(URL_CSV, {
    download: true,
    header: true,
    skipEmptyLines: true,

    complete: function(res) {
        console.log("CSV:", res);

        if (!res.data || res.data.length === 0) {
            lista.innerHTML = '<div class="errore">CSV vuoto o non valido</div>';
            return;
        }

        dati = res.data.filter(r => getVal(r, ["sigla"], "") !== "");

        render(dati);
    },

    error: function(err) {
        console.error(err);
        lista.innerHTML = '<div class="errore">Errore nel caricamento dati</div>';
    }
});

function render(arr) {
    lista.innerHTML = "";

    if (arr.length === 0) {
        lista.innerHTML = '<div class="loading">Nessun risultato</div>';
        return;
    }

    arr.forEach(m => {
        const sigla = getVal(m, ["sigla"]);
        const modello = getVal(m, ["modello"]);
        const targa = getVal(m, ["targa"]);
        const compagnia = getVal(m, ["compagnia"]);
        const polizza = getVal(m, ["polizza"]);
        const scadenza = getVal(m, ["scadenza"]);

        const testo = `
Mezzo: ${sigla} - ${modello}
Targa: ${targa}
Assicurazione: ${compagnia}
Polizza: ${polizza}
Scadenza: ${scadenza}
        `;

        const card = document.createElement("div");
        card.className = "mezzo-card";

        card.innerHTML = `
            <div class="mezzo-header">
                <div class="mezzo-sigla">🚑 ${sigla}</div>
                <div class="mezzo-targa">${targa}</div>
            </div>
            <div>${modello}</div>
            <div>${compagnia}</div>
            <div><b>${polizza}</b> (${scadenza})</div>
        `;

        const btn = document.createElement("button");
        btn.className = "btn-copia";
        btn.innerText = "📄 Copia dati";

        btn.onclick = () => {
            navigator.clipboard.writeText(testo);
            alert("Copiato!");
        };

        card.appendChild(btn);
        lista.appendChild(card);
    });
}

// ricerca
search.addEventListener("input", e => {
    const t = e.target.value.toLowerCase();

    const filtrati = dati.filter(m =>
        getVal(m, ["sigla"]).toLowerCase().includes(t) ||
        getVal(m, ["targa"]).toLowerCase().includes(t)
    );

    render(filtrati);
});
</script>

</body>
</html>
